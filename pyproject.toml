[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".deployment-package",
    "artifact",
    "target",
]

[tool.ruff.lint]
# Phase 1 starts with correctness-oriented rules so CI blocks real Python
# mistakes without forcing a repository-wide style rewrite in the same PR.
select = ["E9", "F63", "F7", "F82"]
