name: Temporary P3B acceptance fixes

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - .github/workflows/tmp-p3b-acceptance-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0

      - name: Apply targeted source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Mask sensitive query parameters in notification target URLs returned to WebUI.
          replace_once(
              "lanzou_update_push_api_server/config.py",
              "from typing import Any\n\n\nPACKAGE_DIR",
              "from typing import Any\nfrom urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\n\n\n_SENSITIVE_QUERY_KEYS = {\n    \"access_token\",\n    \"api_key\",\n    \"apikey\",\n    \"auth\",\n    \"authorization\",\n    \"key\",\n    \"password\",\n    \"secret\",\n    \"signature\",\n    \"token\",\n}\n\n\ndef _is_sensitive_query_key(name: str) -> bool:\n    normalized = str(name or \"\").strip().lower().replace(\"-\", \"_\")\n    return normalized in _SENSITIVE_QUERY_KEYS or normalized.endswith(\n        (\"_token\", \"_secret\", \"_password\", \"_key\")\n    )\n\n\ndef _mask_sensitive_url(value: str) -> str:\n    text = str(value or \"\")\n    parts = urlsplit(text)\n    if not parts.query:\n        return text\n    pairs = [\n        (key, \"***\" if _is_sensitive_query_key(key) else item_value)\n        for key, item_value in parse_qsl(parts.query, keep_blank_values=True)\n    ]\n    return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(pairs), parts.fragment))\n\n\nPACKAGE_DIR",
          )
          replace_once(
              "lanzou_update_push_api_server/config.py",
              '                "url": target.url,',
              '                "url": _mask_sensitive_url(target.url),',
          )

          # Preserve masked URL query secrets only when the destination itself did not change.
          replace_once(
              "lanzou_update_push_api_server/management.py",
              "from urllib.parse import urlparse",
              "from urllib.parse import parse_qsl, urlencode, urlparse, urlsplit, urlunsplit",
          )
          replace_once(
              "lanzou_update_push_api_server/management.py",
              '''def _validate_http_url(value: str, name: str, allow_empty: bool = False) -> str:\n    text = str(value or "").strip()\n    if allow_empty and not text:\n        return ""\n    parsed = urlparse(text)\n    if parsed.scheme not in {"http", "https"} or not parsed.netloc:\n        raise ValueError(f"{name} must be an http or https URL")\n    return text\n\n\ndef update_lanzou_config''',
              '''def _validate_http_url(value: str, name: str, allow_empty: bool = False) -> str:\n    text = str(value or "").strip()\n    if allow_empty and not text:\n        return ""\n    parsed = urlparse(text)\n    if parsed.scheme not in {"http", "https"} or not parsed.netloc:\n        raise ValueError(f"{name} must be an http or https URL")\n    return text\n\n\ndef _merge_masked_query_url(candidate: str, previous: str, name: str) -> str:\n    if "***" not in candidate:\n        return candidate\n    if not previous:\n        raise ValueError(f"{name} contains a masked value but no previous URL exists")\n    candidate_parts = urlsplit(candidate)\n    previous_parts = urlsplit(previous)\n    if (\n        candidate_parts.scheme.lower(),\n        candidate_parts.netloc.lower(),\n        candidate_parts.path,\n    ) != (\n        previous_parts.scheme.lower(),\n        previous_parts.netloc.lower(),\n        previous_parts.path,\n    ):\n        raise ValueError(f"{name} destination changed; replace masked query values explicitly")\n    previous_values: dict[str, list[str]] = {}\n    for key, value in parse_qsl(previous_parts.query, keep_blank_values=True):\n        previous_values.setdefault(key, []).append(value)\n    merged: list[tuple[str, str]] = []\n    used: dict[str, int] = {}\n    for key, value in parse_qsl(candidate_parts.query, keep_blank_values=True):\n        if value == "***":\n            position = used.get(key, 0)\n            available = previous_values.get(key, [])\n            if position >= len(available):\n                raise ValueError(f"{name} cannot restore masked query parameter: {key}")\n            value = available[position]\n            used[key] = position + 1\n        merged.append((key, value))\n    return urlunsplit((\n        candidate_parts.scheme,\n        candidate_parts.netloc,\n        candidate_parts.path,\n        urlencode(merged),\n        candidate_parts.fragment,\n    ))\n\n\ndef update_lanzou_config''',
          )
          replace_once(
              "lanzou_update_push_api_server/management.py",
              '''            previous_headers = (previous or {}).get("headers") or {}\n            merged_headers = {}''',
              '''            candidate_url = _validate_http_url(raw.get("url"), f"notify target {index} url")\n            previous_url = str((previous or {}).get("url") or "").strip()\n            target_url = _merge_masked_query_url(candidate_url, previous_url, f"notify target {index} url")\n            previous_headers = (previous or {}).get("headers") or {}\n            merged_headers = {}''',
          )
          replace_once(
              "lanzou_update_push_api_server/management.py",
              '                    "url": _validate_http_url(raw.get("url"), f"notify target {index} url"),',
