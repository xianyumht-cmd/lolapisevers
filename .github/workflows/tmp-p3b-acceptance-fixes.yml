              '''  <article class="panel">\n    <header class="panel-header"><div><h2>通知模板</h2><p>可使用标题、链接等现有模板变量</p></div></header>\n    <div class="panel-body">\n      <div class="alert alert-warning" id="lzTemplateEncodingWarning" hidden>检测到历史 WebUI 编码损坏。当前运行模板保持原样；只有重新输入内容后才会替换。</div>\n      <label class="field"><span>推送消息模板</span><textarea id="lzTemplate" rows="10" placeholder="留空保留当前运行模板"></textarea></label>\n    </div>\n  </article>''',
          )
          replace_once(
              "lanzou_update_push_api_server/control_ui/configuration.py",
              '''      <label class="field"><span>Query 与 Path 参数 JSON</span><textarea id="debuggerQuery" rows="9">{}</textarea></label>\n      <label class="field"><span>请求体 JSON</span><textarea id="debuggerBody" rows="9">{}</textarea></label>''',
              '''      <label class="field"><span>Query 与 Path 参数 JSON</span><textarea id="debuggerQuery" rows="9">{}</textarea></label>\n      <label class="field"><span>请求 Headers JSON</span><textarea id="debuggerHeaders" rows="6">{}</textarea></label>\n      <label class="field"><span>请求体 JSON</span><textarea id="debuggerBody" rows="9">{}</textarea></label>''',
          )
          replace_once(
              "lanzou_update_push_api_server/control_ui/configuration.py",
              'description="管理多个通知回调地址、超时和请求 Headers。Header 值只返回掩码，未修改的掩码会安全保留原值。",',
              'description="管理多个通知回调地址、超时和请求 Headers。Header 与 URL 敏感查询值只返回掩码，未修改的掩码会安全保留原值。",',
          )

          js = "lanzou_update_push_api_server/control_ui/assets/configuration.js"
          replace_once(
              js,
              '''    lanzou: null,\n    environmentOverrides: {},''',
              '''    lanzou: null,\n    lanzouTemplatePreserve: false,\n    lanzouTemplateBaseline: '',\n    environmentOverrides: {},''',
          )
          replace_once(
              js,
              '''  function parseJsonValue(raw, label, fallback = {}) {\n    const text = String(raw || '').trim();\n    if (!text) return fallback;\n    try {\n      const value = JSON.parse(text);\n      if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('必须是 JSON 对象');\n      return value;\n    } catch (error) { throw new Error(`${label} JSON 格式错误：${error.message}`); }\n  }''',
              '''  function parseJsonValue(raw, label, fallback = {}) {\n    const text = String(raw || '').trim();\n    if (!text) return fallback;\n    try {\n      const value = JSON.parse(text);\n      if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('必须是 JSON 对象');\n      return value;\n    } catch (error) { throw new Error(`${label} JSON 格式错误：${error.message}`); }\n  }\n\n  function looksLikeLegacyTemplateEncodingDamage(value) {\n    const text = String(value || '');\n    return /\\?{3,}/.test(text) && text.includes('{title}') && text.includes('{url}');\n  }''',
          )
          replace_once(
              js,
              "    if ($('lzTemplate')) $('lzTemplate').value = config.notification_template || '';",
              '''    const template = String(config.notification_template || '');\n    const templateDamaged = looksLikeLegacyTemplateEncodingDamage(template);\n    state.lanzouTemplatePreserve = templateDamaged;\n    state.lanzouTemplateBaseline = templateDamaged ? '' : template;\n    if ($('lzTemplate')) {\n      $('lzTemplate').value = state.lanzouTemplateBaseline;\n      $('lzTemplate').placeholder = templateDamaged ? '历史模板已保留；输入新内容才会替换' : '留空保留当前运行模板';\n    }\n    const templateWarning = $('lzTemplateEncodingWarning');\n    if (templateWarning) templateWarning.hidden = !templateDamaged;''',
          )
          replace_once(
              js,
              '''      wer_api_password_param: $('lzWerPwdParam').value,\n      notification_template: $('lzTemplate').value,\n    };\n    const key = $('lzWerKey').value.trim();''',
              '''      wer_api_password_param: $('lzWerPwdParam').value,\n    };\n    const template = $('lzTemplate').value;\n    if (!state.lanzouTemplatePreserve || template !== state.lanzouTemplateBaseline) {\n      patch.notification_template = template;\n    }\n    const key = $('lzWerKey').value.trim();''',
          )
          replace_once(
              js,
              '''    $('debuggerQuery').value = JSON.stringify(query, null, 2);\n    $('debuggerBody').value = '{}';''',
              '''    $('debuggerQuery').value = JSON.stringify(query, null, 2);\n    $('debuggerHeaders').value = '{}';\n    $('debuggerBody').value = '{}';''',
          )
          replace_once(
              js,
              '''    let query; let body;\n    try {\n      query = parseJsonValue($('debuggerQuery').value, 'Query 与 Path 参数');\n      body = parseJsonValue($('debuggerBody').value, '请求体');''',
              '''    let query; let headers; let body;\n    try {\n      query = parseJsonValue($('debuggerQuery').value, 'Query 与 Path 参数');\n      headers = parseJsonValue($('debuggerHeaders').value, '请求 Headers');\n      body = parseJsonValue($('debuggerBody').value, '请求体');''',
          )
          replace_once(
              js,
              '''    const payload = { service: route.service, method: route.method, path: route.path, query, timeout: Number($('debuggerTimeout').value) || 30 };''',
              '''    const payload = { service: route.service, method: route.method, path: route.path, query, headers, timeout: Number($('debuggerTimeout').value) || 30 };''',
          )

          # Server-side debugger Header validation and output redaction.
          replace_once(
              "lanzou_update_push_api_server/api_debugger.py",
              "from urllib.parse import quote",
              "from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit",
          )
          replace_once(
              "lanzou_update_push_api_server/api_debugger.py",
              '''_PATH_PARAMETER_RE = re.compile(r"\\{([^{}]+)\\}")\n_MAX_DEBUG_RESPONSE_BYTES = 5_000_000''',
              '''_PATH_PARAMETER_RE = re.compile(r"\\{([^{}]+)\\}")\n_HEADER_NAME_RE = re.compile(r"^[!#$%&'*+\\-.^_`|~0-9A-Za-z]+$")\n_MAX_DEBUG_RESPONSE_BYTES = 5_000_000\n_MAX_DEBUG_HEADERS = 50\n_MAX_DEBUG_HEADER_VALUE = 8_192\n_BLOCKED_REQUEST_HEADERS = {\n    "connection",\n    "content-length",\n    "host",\n    "proxy-authorization",\n    "proxy-connection",\n    "te",\n    "trailer",\n    "transfer-encoding",\n    "upgrade",\n}\n_SENSITIVE_NAMES = {\n    "access_token",\n    "api_key",\n    "apikey",\n    "auth",\n    "authorization",\n    "cookie",\n    "key",\n    "password",\n    "secret",\n    "set_cookie",\n    "signature",\n    "token",\n}\n\n\ndef _is_sensitive_name(name: str) -> bool:\n    normalized = str(name or "").strip().lower().replace("-", "_")\n    return normalized in _SENSITIVE_NAMES or normalized.endswith(\n        ("_token", "_secret", "_password", "_key", "_cookie")\n    )\n\n\ndef _redact_headers(headers: dict[str, Any]) -> dict[str, str]:\n    return {\n        str(key): ("***" if _is_sensitive_name(str(key)) else str(value))\n        for key, value in headers.items()\n    }\n\n\ndef _redact_url(value: str) -> str:\n    parts = urlsplit(str(value or ""))\n    pairs = [\n        (key, "***" if _is_sensitive_name(key) else item_value)\n        for key, item_value in parse_qsl(parts.query, keep_blank_values=True)\n    ]\n    return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(pairs), parts.fragment))''',
          )
          replace_once(
              "lanzou_update_push_api_server/api_debugger.py",
              '''    timeout = max(1.0, min(120.0, float(payload.get("timeout") or 30.0)))\n    body = payload.get("json")\n    headers = {"x-admin-token": admin_token} if admin_token else {}''',
              '''    timeout = max(1.0, min(120.0, float(payload.get("timeout") or 30.0)))\n    body = payload.get("json")\n    raw_headers = payload.get("headers") or {}\n    if not isinstance(raw_headers, dict):\n        raise ValueError("headers must be an object")\n    if len(raw_headers) > _MAX_DEBUG_HEADERS:\n        raise ValueError("too many request headers")\n    headers: dict[str, str] = {}\n    for raw_name, raw_value in raw_headers.items():\n        name = str(raw_name or "").strip()\n        lower_name = name.lower()\n        if not name or not _HEADER_NAME_RE.fullmatch(name):\n            raise ValueError(f"invalid request header name: {name}")\n        if lower_name in _BLOCKED_REQUEST_HEADERS:\n            raise ValueError(f"request header is not allowed: {name}")\n        value = str(raw_value)\n        if "\\r" in value or "\\n" in value or len(value) > _MAX_DEBUG_HEADER_VALUE:\n            raise ValueError(f"invalid request header value: {name}")\n        headers[name] = value\n    if admin_token:\n        headers["x-admin-token"] = admin_token''',
          )
          replace_once(
              "lanzou_update_push_api_server/api_debugger.py",
              '''            "headers": {key: value for key, value in response.headers.items()},\n            "request_url": str(getattr(response, "url", f"{base_url.rstrip('/')}{path}")),''',
              '''            "headers": _redact_headers(dict(response.headers.items())),\n            "request_url": _redact_url(str(getattr(response, "url", f"{base_url.rstrip('/')}{path}"))),''',
          )

          # Tests for the three acceptance defects.
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''        self.assertIn("password_configured", script)\n        self.assertIn("clear_password", script)''',
              '''        self.assertIn("password_configured", script)\n        self.assertIn("clear_password", script)\n        self.assertIn("looksLikeLegacyTemplateEncodingDamage", script)\n        self.assertIn("lanzouTemplatePreserve", script)\n        self.assertIn("debuggerHeaders", script)''',
          )
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''            notify_targets=[NotifyTargetConfig(name="target", url="http://127.0.0.1:6108/", headers={"x-token": "secret"})],''',
              '''            notify_targets=[NotifyTargetConfig(name="target", url="http://127.0.0.1:6108/event?token=url-secret&mode=push", headers={"x-token": "secret"})],''',
          )
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''        self.assertEqual(payload["notify_targets"][0]["headers"]["x-token"], "***")\n        self.assertNotIn("secret-api-key", json.dumps(payload))''',
              '''        self.assertEqual(payload["notify_targets"][0]["headers"]["x-token"], "***")\n        self.assertIn("token=%2A%2A%2A", payload["notify_targets"][0]["url"])\n        self.assertIn("mode=push", payload["notify_targets"][0]["url"])\n        self.assertNotIn("url-secret", json.dumps(payload))\n        self.assertNotIn("secret-api-key", json.dumps(payload))''',
          )
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''                    "url": "http://127.0.0.1:6108/",\n                    "timeout_seconds": 8,''',
              '''                    "url": "http://127.0.0.1:6108/event?token=existing-url-token&mode=push",\n                    "timeout_seconds": 8,''',
          )
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''                        "url": "http://127.0.0.1:6108/",\n                        "timeout_seconds": 9,''',
              '''                        "url": "http://127.0.0.1:6108/event?token=%2A%2A%2A&mode=push",\n                        "timeout_seconds": 9,''',
          )
          replace_once(
              "tests/test_control_ui_configuration.py",
              '''        self.assertEqual(saved["notify_targets"][0]["headers"]["x-token"], "existing-token")\n        self.assertEqual(saved["notify_targets"][0]["headers"]["x-mode"], "new")''',
              '''        self.assertEqual(saved["notify_targets"][0]["headers"]["x-token"], "existing-token")\n        self.assertEqual(saved["notify_targets"][0]["headers"]["x-mode"], "new")\n        self.assertIn("token=existing-url-token", saved["notify_targets"][0]["url"])\n        self.assertIn("mode=push", saved["notify_targets"][0]["url"])''',
          )

          test_api = Path("tests/test_api_debugger.py")
          text = test_api.read_text(encoding="utf-8")
          marker = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          addition = r'''

    def test_custom_headers_are_forwarded_and_sensitive_output_is_redacted(self):
        class FakeResponse:
            ok = True
            status_code = 200
            headers = {
                "content-type": "application/json",
                "set-cookie": "session=secret-cookie",
                "x-request-id": "demo",
            }
            content = b'{"ok":true}'
            url = "http://127.0.0.1:6178/admin/audit?token=secret-query&limit=5"

        with patch("lanzou_update_push_api_server.api_debugger.requests.request", return_value=FakeResponse()) as request_mock:
            result = invoke_api(
                "http://127.0.0.1:6178",
                {
                    "method": "GET",
                    "path": "/admin/audit",
                    "query": {"limit": 5},
                    "headers": {"x-client": "webui", "authorization": "Bearer secret"},
                },
                admin_token="internal-admin-token",
            )

        sent_headers = request_mock.call_args.kwargs["headers"]
        self.assertEqual(sent_headers["x-client"], "webui")
        self.assertEqual(sent_headers["authorization"], "Bearer secret")
        self.assertEqual(sent_headers["x-admin-token"], "internal-admin-token")
        self.assertEqual(result["headers"]["set-cookie"], "***")
        self.assertEqual(result["headers"]["x-request-id"], "demo")
        self.assertNotIn("secret-query", result["request_url"])
        self.assertIn("token=%2A%2A%2A", result["request_url"])

    def test_hop_by_hop_and_host_headers_are_rejected(self):
        for name in ("host", "content-length", "connection"):
            with self.subTest(name=name):
                with self.assertRaisesRegex(ValueError, "not allowed"):
                    invoke_api(
                        "http://127.0.0.1:6178",
                        {
                            "method": "GET",
                            "path": "/health",
                            "headers": {name: "unsafe"},
                        },
                    )
'''
          if marker not in text:
