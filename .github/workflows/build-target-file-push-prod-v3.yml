name: Build target file push production V3

on:
  push:
    branches:
      - build/target-file-push-prod-dda1c-v3-20260808
  pull_request:
    branches:
      - fix/target-file-push-prod-dda1c-20260808

jobs:
  build-target-file-v3:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET_COMMIT: acc6ad2f4e0f47d84d6e9ceb916f400f9782b2a2

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create immutable target worktree
        shell: pwsh
        run: |
          git cat-file -e "$env:TARGET_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Target commit is unavailable." }
          git worktree add --detach candidate-target-file $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Unable to create target worktree." }
          $resolved = (git -C candidate-target-file rev-parse HEAD).Trim()
          if ($resolved -ne $env:TARGET_COMMIT) { throw "Immutable target mismatch." }

      - name: Install target dependencies and audit tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate-target-file/requirements.txt
          python -m pip install pip-audit

      - name: Run immutable target tests
        shell: pwsh
        run: |
          Push-Location candidate-target-file
          try {
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests -p "test_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Parse target PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem candidate-target-file -Filter *.ps1 -File -Recurse)
          if ($files.Count -eq 0) { throw "No PowerShell files were found." }
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
                  exit 1
              }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) scripts successfully."

      - name: Audit immutable target dependencies
        shell: pwsh
        run: python -m pip_audit -r candidate-target-file/requirements.txt --strict

      - name: Build immutable V3 deployment package
        shell: powershell
        run: |
          .\ops\Build-FullBugRepairPackageV3.ps1 `
              -RepositoryRoot "$pwd" `
              -TargetCommit "$env:TARGET_COMMIT" `
              -OutputRoot "$pwd\dist-target-file-v3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package target hashes and safety flags
        shell: pwsh
        run: |
          $metadataFile = Get-ChildItem dist-target-file-v3 -Filter *.metadata.json -File | Select-Object -First 1
          $zipFile = Get-ChildItem dist-target-file-v3 -Filter *.zip -File | Select-Object -First 1
          if (-not $metadataFile -or -not $zipFile) { throw "V3 package files are missing." }

          $metadata = Get-Content $metadataFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($metadata.target_commit)" -ne $env:TARGET_COMMIT) { throw "Target commit mismatch." }
          if ([int]$metadata.package_revision -ne 3) { throw "Package revision mismatch." }
          if (-not [bool]$metadata.powershell_utf8_parse_input) { throw "UTF-8 parse safety flag is missing." }
          $zipHash = (Get-FileHash $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "$($metadata.zip_sha256)".ToLowerInvariant()) { throw "ZIP SHA-256 mismatch." }

          $extract = Join-Path $env:RUNNER_TEMP "target-file-v3-final"
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath $extract -Force
          $manifestFile = Get-ChildItem $extract -Filter manifest.json -File -Recurse | Select-Object -First 1
          if (-not $manifestFile) { throw "Embedded manifest is missing." }
          $manifest = Get-Content $manifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($manifest.target_commit)" -ne $env:TARGET_COMMIT) { throw "Manifest target mismatch." }
          if ([int]$manifest.package_revision -ne 3) { throw "Manifest revision mismatch." }
          foreach ($flag in @("candidate_tests_before_stop", "automatic_rollback", "offline_dependencies", "powershell_utf8_parse_input")) {
              if (-not [bool]$manifest.deployment.$flag) { throw "Safety flag missing: $flag" }
          }
          foreach ($entry in @($manifest.files)) {
              $path = Join-Path $manifestFile.Directory.FullName ("$($entry.path)".Replace("/", "\"))
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Package file missing: $($entry.path)" }
              if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne "$($entry.sha256)".ToLowerInvariant()) {
                  throw "Package hash mismatch: $($entry.path)"
              }
          }
          Get-Content $metadataFile.FullName -Raw

      - name: Upload target file production V3 package
        uses: actions/upload-artifact@v4
        with:
          name: LOLDataSystem-target-file-push-prod-acc6ad2-v3
          path: |
            dist-target-file-v3/*.zip
            dist-target-file-v3/*.metadata.json
          if-no-files-found: error
          retention-days: 14
