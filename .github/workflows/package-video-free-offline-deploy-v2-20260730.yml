name: package video-free offline deploy v2

on:
  push:
    branches:
      - feat/all-query-delivery-hub-20260729
    paths:
      - .github/workflows/package-video-free-offline-deploy-v2-20260730.yml

permissions:
  contents: write
  actions: read

jobs:
  verify-package-record:
    runs-on: windows-2025
    env:
      TARGET_COMMIT: f221b64649763eb8d325d87348fd2f42f48a6485
      ARTIFACT_NAME: loldata-video-free-offline-safe-deploy-f221b64649763eb8d325d87348fd2f42f48a6485
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-query-delivery-hub-20260729
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Materialize exact target outside repository
        shell: pwsh
        run: |
          $targetRoot = Join-Path $env:RUNNER_TEMP 'lapi-video-free-target'
          if (Test-Path $targetRoot) { Remove-Item $targetRoot -Recurse -Force }
          git cat-file -e "$env:TARGET_COMMIT`^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Target commit is missing' }
          git worktree add $targetRoot $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create target worktree' }
          if ((git -C $targetRoot rev-parse HEAD).Trim() -ne $env:TARGET_COMMIT) { throw 'Target worktree mismatch' }
          "TARGET_ROOT=$targetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and validate exact target
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r (Join-Path $env:TARGET_ROOT 'requirements.txt')
          Push-Location $env:TARGET_ROOT
          try {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { throw 'Compileall failed' }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { throw 'WebUI generation failed' }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { throw 'Generated JavaScript syntax failed' }
          } finally {
            Pop-Location
          }

      - name: Validate all deployment scripts with Windows PowerShell parser
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $PWD 'ops/Deploy-LapiVideoFreeOffline.ps1'),
            (Join-Path $env:TARGET_ROOT 'ops/Deploy-LapiQueryHardening.ps1'),
            (Join-Path $env:TARGET_ROOT 'ops/Rollback-LapiQueryHardening.ps1'),
            (Join-Path $env:TARGET_ROOT 'ops/Test-LapiQueryHardening.ps1'),
            (Join-Path $env:TARGET_ROOT 'ops/remove-retired-video-provider-config.ps1')
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              throw "PowerShell parser rejected $path"
            }
          }

      - name: Build package entirely outside repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $env:TARGET_COMMIT.ToLowerInvariant()
          $short = $target.Substring(0, 12)
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'video-free-artifact'
          $packageRoot = Join-Path $artifactRoot "loldata-video-free-offline-safe-deploy-$short"
          if (Test-Path $artifactRoot) { Remove-Item $artifactRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          git branch -f lapi-video-free-target $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create exact bundle ref' }
          $bundle = Join-Path $packageRoot 'lapi-video-free-offline.bundle'
          git bundle create $bundle refs/heads/lapi-video-free-target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create bundle' }
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Bundle verify failed' }
          $heads = (git bundle list-heads $bundle).Trim()
          if ($heads -ne "$target refs/heads/lapi-video-free-target") { throw "Bundle heads mismatch: $heads" }

          Copy-Item 'ops/Deploy-LapiVideoFreeOffline.ps1' (Join-Path $packageRoot 'deploy-video-free-api.ps1') -Force
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 'lapi-video-free-offline-deploy.v1'
            target_commit = $target
            source_pr = 19
            bundle_ref = 'refs/heads/lapi-video-free-target'
            bundle_sha256 = $bundleHash
            tests = 'pass'
            video_feature = 'retired'
            old_groupguard_dist = 'revoked_do_not_deploy'
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $packageRoot 'PACKAGE-MANIFEST.json'),
            (($manifest | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false))
          )
          [System.IO.File]::WriteAllText((Join-Path $packageRoot 'TARGET_COMMIT.txt'), ($target + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          $cmd = @"
          @echo off
          chcp 65001 >nul
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0deploy-video-free-api.ps1" -ExpectedCommit $target
          echo.
          if errorlevel 1 (
            echo DEPLOYMENT FAILED OR ROLLED BACK. Keep the window output.
          ) else (
            echo DEPLOYMENT SUCCEEDED.
          )
          pause
          "@.Trim()
          [System.IO.File]::WriteAllText((Join-Path $packageRoot 'run-deploy.cmd'), ($cmd + [Environment]::NewLine), [System.Text.Encoding]::ASCII)
          $readme = @"
          LOLDataSystem video-free offline safe deployment

          Target commit: $target

          Extract this ZIP completely, then double-click run-deploy.cmd and approve Administrator access.
          The launcher imports only the fixed bundle, runs candidate tests before stopping production, backs up runtime state, removes only QUERY_VIDEO_PROVIDERS_JSON, verifies that video is rejected, and rolls back the full deployment on post-deployment failure.
          Never deploy revoked GroupGuard commit 029118346adaa9232aeceeb283f5d243a407dc95.
          "@.Trim()
          [System.IO.File]::WriteAllText((Join-Path $packageRoot 'README.txt'), ($readme + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))

          $zip = Join-Path $artifactRoot "loldata-video-free-offline-safe-deploy-$short.zip"
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $artifactRoot 'SHA256SUMS.txt'), ("$zipHash  $([System.IO.Path]::GetFileName($zip))" + [Environment]::NewLine), [System.Text.Encoding]::ASCII)
          "ARTIFACT_ROOT=$artifactRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SHA256=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_SHA256=$bundleHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/*.zip
            ${{ env.ARTIFACT_ROOT }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable package coordinates and remove one-shot workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:CURRENT_RUN_ID/artifacts"
          $result = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $artifact = @($result.artifacts | Where-Object { $_.name -eq $env:ARTIFACT_NAME }) | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Uploaded artifact was not returned by the Actions API' }
          $status = [ordered]@{
            '$schema' = 'https://json-schema.org/draft/2020-12/schema'
            schema = 'lapi-video-free-package-status.v1'
            status = 'package_verified_ready_for_windows_operator_deployment'
            target_commit = $env:TARGET_COMMIT.ToLowerInvariant()
            workflow_run_id = [long]$env:CURRENT_RUN_ID
            artifact_id = [long]$artifact.id
            artifact_name = "$($artifact.name)"
            artifact_digest = "$($artifact.digest)"
            zip_sha256 = $env:ZIP_SHA256.ToLowerInvariant()
            bundle_sha256 = $env:BUNDLE_SHA256.ToLowerInvariant()
            expires_at = "$($artifact.expires_at)"
            video_feature = 'retired'
            old_groupguard_dist = 'revoked_do_not_deploy'
            next_action = 'Download, extract, and run run-deploy.cmd on the Windows API host; then return the complete console output.'
          }
          $statusPath = 'docs/checkpoints/API_VIDEO_FREE_PACKAGE_STATUS_20260730.json'
          [System.IO.File]::WriteAllText($statusPath, (($status | ConvertTo-Json -Depth 8) + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          Remove-Item '.github/workflows/package-video-free-offline-deploy-v2-20260730.yml' -Force
          git config user.name 'openai-gpt-5.6-thinking'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $statusPath '.github/workflows/package-video-free-offline-deploy-v2-20260730.yml'
          git diff --cached --check
          git commit -m 'docs(release): record video-free deployment artifact'
          git push origin HEAD:feat/all-query-delivery-hub-20260729
