name: Build production safe deployment package V3

on:
  push:
    branches:
      - master
      - release/full-bug-repair-safe-deploy-winps51-v3-20260801
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package-v3:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout V3 builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create immutable target worktree
        shell: pwsh
        run: |
          git cat-file -e "$env:TARGET_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Target commit is unavailable."
          }
          git worktree add --detach candidate-v3 $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create immutable target worktree."
          }

      - name: Install target dependencies and audit tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate-v3/requirements.txt
          python -m pip install pip-audit

      - name: Run immutable target tests
        shell: pwsh
        run: |
          Push-Location candidate-v3
          try {
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests -p "test_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check lanzou_update_push_api_server/control_ui/assets/release-update.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Parse every target script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem candidate-v3 -Filter *.ps1 -File -Recurse)
          if ($files.Count -eq 0) {
              throw "No PowerShell files were found."
          }
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
                  exit 1
              }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) scripts successfully."

      - name: Audit target dependency set
        shell: pwsh
        run: python -m pip_audit -r candidate-v3/requirements.txt --strict

      - name: Build V3 immutable offline deployment package
        shell: powershell
        run: |
          .\ops\Build-FullBugRepairPackageV3.ps1 `
              -RepositoryRoot "$pwd" `
              -TargetCommit "$env:TARGET_COMMIT" `
              -OutputRoot "$pwd\dist-v3"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Patch V3 WinPS5.1 native process stderr handling
        shell: powershell
        run: |
          .\ops\Patch-V3-WinPS51ReleaseArtifact.ps1 -DistRoot "$pwd\dist-v3"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Patch V3 runtime bootstrap ACL handling
        shell: powershell
        run: |
          .\ops\Patch-V3-RuntimeBootstrapAcl.ps1 -DistRoot "$pwd\dist-v3"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Patch V3 production venv ACL lifecycle
        shell: powershell
        run: |
          .\ops\Patch-V3-ProductionVenvAcl.ps1 -DistRoot "$pwd\dist-v3"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Verify V3 package hashes and safety flags
        shell: pwsh
        run: |
          $metadataFile = Get-ChildItem dist-v3 -Filter *.metadata.json -File | Select-Object -First 1
          $zipFile = Get-ChildItem dist-v3 -Filter *.zip -File | Select-Object -First 1
          if (-not $metadataFile -or -not $zipFile) {
            throw "V3 package files are missing."
          }

          $metadata = Get-Content $metadataFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($metadata.target_commit)" -ne $env:TARGET_COMMIT) {
            throw "V3 target commit mismatch."
          }
          if ([int]$metadata.package_revision -ne 3) {
            throw "V3 metadata revision mismatch."
          }
          foreach ($flag in @(
            "powershell_utf8_parse_input",
            "baseline_aware_readiness",
            "winps51_native_git_stderr_safe",
            "winps51_native_process_stderr_safe",
            "runtime_bootstrap_acl_safe",
            "runtime_listener_bootstrap_discovery",
            "production_venv_acl_recovery",
            "installed_venv_acl_normalized",
            "venv_acl_well_known_sids"
          )) {
            if (-not [bool]$metadata.$flag) {
              throw "V3 metadata safety flag is missing: $flag"
            }
          }
          $zipHash = (Get-FileHash $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "$($metadata.zip_sha256)".ToLowerInvariant()) {
            throw "V3 ZIP SHA-256 mismatch."
          }

          $extract = Join-Path $env:RUNNER_TEMP "full-bug-repair-v3-final"
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath $extract -Force
          $manifestFile = Get-ChildItem $extract -Filter manifest.json -File -Recurse | Select-Object -First 1
          if (-not $manifestFile) {
            throw "V3 embedded manifest is missing."
          }
          $manifest = Get-Content $manifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($manifest.target_commit)" -ne $env:TARGET_COMMIT) {
            throw "V3 embedded target commit mismatch."
          }
          if ([int]$manifest.package_revision -ne 3) {
            throw "V3 embedded revision mismatch."
          }
          foreach ($flag in @(
            "candidate_tests_before_stop",
            "automatic_rollback",
            "offline_dependencies",
            "powershell_utf8_parse_input",
            "baseline_aware_readiness",
            "winps51_native_git_stderr_safe",
            "winps51_native_process_stderr_safe",
            "runtime_bootstrap_acl_safe",
            "runtime_listener_bootstrap_discovery",
            "production_venv_acl_recovery",
            "installed_venv_acl_normalized",
            "venv_acl_well_known_sids"
          )) {
            if (-not [bool]$manifest.deployment.$flag) {
              throw "V3 safety flag is missing: $flag"
            }
          }
          foreach ($version in @("3.11", "3.12", "3.13", "3.14")) {
            if (@($manifest.deployment.supported_python_versions) -notcontains $version) {
              throw "V3 manifest is missing Python $version support."
            }
          }

          foreach ($entry in @($manifest.files)) {
            $path = Join-Path $manifestFile.Directory.FullName ("$($entry.path)".Replace("/", "\"))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "V3 package file is missing: $($entry.path)"
            }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne "$($entry.sha256)".ToLowerInvariant()) {
              throw "V3 package hash mismatch: $($entry.path)"
            }
            if ([int64](Get-Item $path).Length -ne [int64]$entry.bytes) {
              throw "V3 package size mismatch: $($entry.path)"
            }
          }

          $deployFile = Join-Path $manifestFile.Directory.FullName "Deploy-FullBugRepairSafe.ps1"
          $deployText = Get-Content $deployFile -Raw -Encoding UTF8
          foreach ($marker in @(
            "Parser]::ParseInput(",
            "Get-Content -LiteralPath `$file.FullName -Raw -Encoding UTF8",
            "Production Python must be 3.11, 3.12, 3.13, or 3.14",
            "Production was not stopped or changed",
            "Capture pre-switch production health baseline",
            "pre-switch-health.json",
            "BaselineHealthPath",
            "Automatic rollback is starting",
            'Invoke-Git -WorkingDirectory $ProjectRoot -Arguments @("bundle", "verify", $bundlePath)',
            'Invoke-Git -WorkingDirectory $ProjectRoot -Arguments @("clone", "--no-checkout", $bundlePath, $candidateRepository)',
            "function Invoke-NativeProcess {",
            'Invoke-NativeProcess -FilePath $candidatePython -Arguments @(',
            '"-m", "unittest", "discover"',
            'Get-NetTCPConnection -State Listen -LocalPort $listenerPort',
            'Get-CimInstance Win32_Process',
            'Production venv bootstrap is not readable; continuing with system Python discovery',
            'Resolve-BootstrapPython -Root $ProjectRoot -BaseUrl $BaseUrl',
            'function Ensure-ManagedVenvAcl {',
            '"*S-1-5-32-544:(OI)(CI)F"',
            '"*S-1-5-18:(OI)(CI)F"',
            'Ensure-ManagedVenvAcl -Path $oldVenv -Label "existing production venv"',
            'Ensure-ManagedVenvAcl -Path $installedVenv -Label "installed production venv"'
          )) {
            if (-not $deployText.Contains($marker)) {
              throw "V3 deployment marker is missing: $marker"
            }
          }

          if ($deployText.Contains('& (Resolve-GitExecutable) -C $ProjectRoot bundle verify')) {
            throw "V3 deployment still contains unsafe native bundle verify."
          }
          if ($deployText.Contains('& (Resolve-GitExecutable) clone --no-checkout')) {
            throw "V3 deployment still contains unsafe native clone."
          }
          foreach ($unsafeNative in @(
            '& $BootstrapPython -m venv',
            '& $candidatePython',
            '& $node.Source --check',
            '$bootstrapVersion = (& $bootstrapPython -c'
          )) {
            if ($deployText.Contains($unsafeNative)) {
              throw "V3 deployment still contains unsafe direct native invocation: $unsafeNative"
            }
          }
          foreach ($unsafeAclProbe in @(
            'if (Test-Path -LiteralPath $productionPython -PathType Leaf)',
            'if (Test-Path -LiteralPath $oldVenv -PathType Container)'
          )) {
            if ($deployText.Contains($unsafeAclProbe)) {
              throw "V3 deployment still contains unsafe runtime ACL probe: $unsafeAclProbe"
            }
          }

          $deployCommand = Get-Command -Name $deployFile -ErrorAction Stop
          $knownUpdaterParameters = @("ProjectRoot", "ProductionRoot", "RepositoryRoot", "BaseUrl", "Hero")
          $unknownMandatory = @()
          foreach ($entry in $deployCommand.Parameters.GetEnumerator()) {
            $attrs = @($entry.Value.Attributes | Where-Object { $_ -is [System.Management.Automation.ParameterAttribute] })
            if (@($attrs | Where-Object { $_.Mandatory }).Count -gt 0 -and $knownUpdaterParameters -notcontains $entry.Key) {
              $unknownMandatory += $entry.Key
            }
          }
          if ($unknownMandatory.Count -gt 0) {
            throw "WebUI updater cannot resolve mandatory deploy parameters: $($unknownMandatory -join ', ')"
          }

          $verifyFile = Join-Path $manifestFile.Directory.FullName "Verify-FullBugRepairProduction.ps1"
          $verifyText = Get-Content $verifyFile -Raw -Encoding UTF8
          foreach ($marker in @(
            "inherited_so1_session_degradation",
            "pass_with_warning",
            "Post-switch MySQL readiness regressed",
            "Post-switch SO1 browser readiness regressed",
            "does not match the pre-switch degradation baseline"
          )) {
            if (-not $verifyText.Contains($marker)) {
              throw "V3 baseline-aware verifier marker is missing: $marker"
            }
          }

          Get-Content $metadataFile.FullName -Raw

      - name: Upload V3 production deployment package
        uses: actions/upload-artifact@v4
        with:
          name: LOLDataSystem-full-bug-repair-safe-deploy-winps51-v3
          path: |
            dist-v3/*.zip
            dist-v3/*.metadata.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-package-v3
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified V3 artifact
        uses: actions/download-artifact@v4
        with:
          name: LOLDataSystem-full-bug-repair-safe-deploy-winps51-v3
          path: release-assets

      - name: Publish verified V3 assets as latest Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          $short = $env:TARGET_COMMIT.Substring(0, 12)
          $tag = "lolapi-$short"
          $zipFile = Get-ChildItem release-assets -Filter *.zip -File -Recurse | Select-Object -First 1
          $metadataFile = Get-ChildItem release-assets -Filter *.metadata.json -File -Recurse | Select-Object -First 1
          if (-not $zipFile -or -not $metadataFile) {
            throw "Verified V3 release assets are missing."
          }
          $metadata = Get-Content $metadataFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($metadata.target_commit)" -ne $env:TARGET_COMMIT) {
            throw "Release metadata target commit does not match master push."
          }
          $notes = "Verified LOLDataSystem V3 production package for commit $env:TARGET_COMMIT. WebUI updater verifies metadata, SHA-256 and embedded manifest before deployment."
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipFile.FullName $metadataFile.FullName --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --latest --title "LOLDataSystem $short" --notes $notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag $zipFile.FullName $metadataFile.FullName --target $env:TARGET_COMMIT --latest --title "LOLDataSystem $short" --notes $notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
