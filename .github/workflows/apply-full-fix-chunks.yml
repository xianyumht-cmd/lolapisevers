name: Apply full confirmed bug repair chunks

on:
  push:
    branches:
      - fix/all-confirmed-bugs-20260801
    paths:
      - .github/workflows/apply-full-fix-chunks.yml
      - .github/fix-bundles/chunks/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/apply-full-fix-chunks.yml
      - .github/fix-bundles/chunks/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/all-confirmed-bugs-20260801
          fetch-depth: 0

      - name: Reassemble and apply
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/tests.yml /tmp/original-tests.yml
          truncate -s 6000 .github/fix-bundles/chunks/part-15
          truncate -s 6000 .github/fix-bundles/chunks/part-16
          cat .github/fix-bundles/chunks/part-* > /tmp/full-confirmed-bugs.tar.gz.b64
          echo "3a5a7cb121bc3fb71162ba2508e2056e6bd88307bb6e9ec0f22690f8a20be8c8  /tmp/full-confirmed-bugs.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/full-confirmed-bugs.tar.gz.b64 > /tmp/full-confirmed-bugs.tar.gz
          tar -xzf /tmp/full-confirmed-bugs.tar.gz -C .
          cp /tmp/original-tests.yml .github/workflows/tests.yml
          rm -rf .github/fix-bundles
          git diff --check

      - name: Commit repair candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: repair all confirmed audit bugs"
          git push origin HEAD:fix/all-confirmed-bugs-20260801
