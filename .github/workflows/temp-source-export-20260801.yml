name: temporary source export 2026-08-01

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact source snapshot
        run: |
          git rev-parse HEAD > AUDIT_SOURCE_SHA.txt
          zip -qr lolapisevers-audit-source.zip . \
            -x '.git/*' \
               '.github/workflows/temp-full-bug-audit-20260801.yml' \
               '.github/workflows/temp-source-export-20260801.yml' \
               '*.pyc' '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: lolapisevers-audit-source
          path: lolapisevers-audit-source.zip
          if-no-files-found: error
