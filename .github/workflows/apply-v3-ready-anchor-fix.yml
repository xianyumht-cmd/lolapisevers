name: Apply V3 ready anchor fix

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - .patches/v3-ready-anchor-fix.patch
      - .github/workflows/apply-v3-ready-anchor-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/webui-control-panel-003-20260805

      - name: Verify and apply patch
        shell: pwsh
        run: |
          $patch = ".patches/v3-ready-anchor-fix.patch"
          if ((Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant() -ne "4e1de9234345a289842be178e216926e73a391b9bd20d757e064d6ae91911424") {
            throw "Patch SHA-256 mismatch."
          }
          if ([int64](Get-Item -LiteralPath $patch).Length -ne 1504) {
            throw "Patch byte length mismatch."
          }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "ops/Build-FullBugRepairPackageV3.ps1") {
            throw "Unexpected patched files: $($changed -join ', ')"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and audit tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Run full safety gate
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_ui_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui_control.generated.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit -r requirements.txt --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse all PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Filter *.ps1 -File -Recurse)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $text = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
            [System.Management.Automation.Language.Parser]::ParseInput($text, $file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
          }

      - name: Commit verified builder source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ops/Build-FullBugRepairPackageV3.ps1
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix(build): normalize ready block anchors"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feat/webui-control-panel-003-20260805
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
