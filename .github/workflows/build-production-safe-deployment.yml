name: Build production safe deployment package

# Legacy compatibility gate.
#
# The original 2026-08-01 package builder was pinned to a28483e and validated
# an exact four-script layout. The current production-safe release path is V3:
# .github/workflows/build-production-safe-deployment-v3.yml.
#
# Keep this workflow/check name so existing repository protection or historical
# references do not break while the old release branches remain available for
# audit. Current master PRs must validate the V3 entry point instead of trying
# to rebuild the retired fixed-target package.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Validate current V3 production-safe release gate
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/build-production-safe-deployment-v3.yml')
          builder = Path('ops/Build-FullBugRepairPackageV3.ps1')

          if not workflow.is_file():
              raise SystemExit('Missing V3 production-safe deployment workflow.')
          if not builder.is_file():
              raise SystemExit('Missing V3 production-safe package builder.')

          text = workflow.read_text(encoding='utf-8')
          required = (
              'name: Build production safe deployment package V3',
              'TARGET_COMMIT:',
              'github.event.pull_request.head.sha',
              'github.sha',
              'Build-FullBugRepairPackageV3.ps1',
              'candidate_tests_before_stop',
              'automatic_rollback',
              'offline_dependencies',
              'powershell_utf8_parse_input',
              'baseline_aware_readiness',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('V3 production-safe gate is missing markers: ' + ', '.join(missing))

          retired_target = 'TARGET_COMMIT: a28483eadb25986031d11ca40e0d26aa6f9e6dfa'
          if retired_target in text:
              raise SystemExit('V3 workflow unexpectedly uses the retired fixed target commit.')

          print('Legacy check compatibility passed: current production-safe packaging is delegated to V3.')

      - name: Explain manual compatibility run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "This workflow is a compatibility gate only."
          echo "Use 'Build production safe deployment package V3' for current immutable deployment artifacts."
