name: Build production safe deployment package

on:
  push:
    branches:
      - release/full-bug-repair-safe-deploy-20260801
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET_COMMIT: a28483eadb25986031d11ca40e0d26aa6f9e6dfa
      TOOLS_ZIP_SHA256: 61d9224287b59c76842936a8c2da9d1ea10c78343dc97a7955ab65ada769497b
    steps:
      - name: Checkout package builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed deployment tools
        shell: pwsh
        run: |
          $chunkRoot = Join-Path $pwd ".deployment-package\full-bug-repair-20260801"
          $chunks = Get-ChildItem $chunkRoot -Filter "chunk-*.txt" -File | Sort-Object Name
          if ($chunks.Count -ne 4) {
            throw "Expected exactly four package tool chunks."
          }
          $encoded = ""
          foreach ($chunk in $chunks) {
            $encoded += (Get-Content $chunk.FullName -Raw -Encoding ASCII).Trim()
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "package-tools.zip"
          [System.IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TOOLS_ZIP_SHA256) {
            throw "Deployment tools archive SHA-256 mismatch."
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $pwd -Force

      - name: Validate deployment safety invariants
        shell: pwsh
        run: |
          $deploy = Get-Content ops/Deploy-FullBugRepairSafe.ps1 -Raw -Encoding UTF8
          $builder = Get-Content ops/Build-FullBugRepairPackage.ps1 -Raw -Encoding UTF8
          $preflight = $deploy.IndexOf('$record.status = "candidate_preflight_passed"')
          $switch = $deploy.IndexOf('$productionSwitchStarted = $true', $preflight)
          $stop = $deploy.IndexOf('Stop-ReleaseService -Name $ServiceName', $switch)
          $backup = $deploy.IndexOf('$backupItems = New-Object', $stop)
          $checkout = $deploy.IndexOf('checkout", "--detach", $TargetCommit', $backup)
          $start = $deploy.IndexOf('Start-ReleaseService -Name $ServiceName', $checkout)
          if ($preflight -lt 0 -or $switch -le $preflight -or $stop -le $switch -or $backup -le $stop -or $checkout -le $backup -or $start -le $checkout) {
            throw "Candidate-test-before-stop ordering invariant failed."
          }
          foreach ($marker in @(
            '--no-index',
            '--find-links',
            'venv.previous',
            'Automatic rollback is starting',
            'Rollback-FullBugRepairSafe.ps1'
          )) {
            if (-not $deploy.Contains($marker)) {
              throw "Required deployment safety marker is missing: $marker"
            }
          }
          foreach ($marker in @(
            'bundle create',
            'pip download',
            'wheelhouse',
            'package_content_sha256',
            'Compress-Archive',
            'zip_sha256'
          )) {
            if (-not $builder.Contains($marker)) {
              throw "Required package builder marker is missing: $marker"
            }
          }
          $scripts = Get-ChildItem ops -Filter "*FullBugRepair*.ps1" -File
          if ($scripts.Count -ne 4) {
            throw "Expected four deployment scripts."
          }
          foreach ($script in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($script.FullName)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "Deployment script is not ASCII safe: $($script.Name)"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" }
              exit 1
            }
          }

      - name: Verify target commit and create immutable worktree
        shell: pwsh
        run: |
          git cat-file -e "$env:TARGET_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Target commit is unavailable."
          }
          git worktree add --detach candidate-ci $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create immutable candidate worktree."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate-ci/requirements.txt

      - name: Install candidate and audit dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate-ci/requirements.txt
          python -m pip install pip-audit

      - name: Run immutable candidate tests
        shell: pwsh
        run: |
          Push-Location candidate-ci
          try {
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests -p "test_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Parse all candidate PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem candidate-ci -Filter *.ps1 -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
          }

      - name: Audit target dependency set
        shell: pwsh
        run: python -m pip_audit -r candidate-ci/requirements.txt --strict

      - name: Build immutable offline deployment ZIP
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            ops/Build-FullBugRepairPackage.ps1 `
            -RepositoryRoot "$pwd" `
            -TargetCommit "$env:TARGET_COMMIT" `
            -OutputRoot "$pwd\dist"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify generated package hashes
        shell: pwsh
        run: |
          $metadataFile = Get-ChildItem dist -Filter *.metadata.json -File | Select-Object -First 1
          $zipFile = Get-ChildItem dist -Filter *.zip -File | Select-Object -First 1
          if (-not $metadataFile -or -not $zipFile) {
            throw "Generated package files are missing."
          }
          $metadata = Get-Content $metadataFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($metadata.target_commit)" -ne $env:TARGET_COMMIT) {
            throw "Package target commit mismatch."
          }
          $zipHash = (Get-FileHash $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "$($metadata.zip_sha256)".ToLowerInvariant()) {
            throw "Package ZIP hash mismatch."
          }
          $extract = Join-Path $env:RUNNER_TEMP "full-bug-repair-package"
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath $extract -Force
          $manifestFile = Get-ChildItem $extract -Filter manifest.json -File -Recurse | Select-Object -First 1
          if (-not $manifestFile) {
            throw "Embedded manifest is missing."
          }
          $manifest = Get-Content $manifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($manifest.target_commit)" -ne $env:TARGET_COMMIT) {
            throw "Embedded target commit mismatch."
          }
          foreach ($entry in @($manifest.files)) {
            $path = Join-Path $manifestFile.Directory.FullName ("$($entry.path)".Replace("/", "\"))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Embedded package file missing: $($entry.path)"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne "$($entry.sha256)".ToLowerInvariant()) {
              throw "Embedded package hash mismatch: $($entry.path)"
            }
          }
          Get-Content $metadataFile.FullName -Raw

      - name: Upload production deployment package
        uses: actions/upload-artifact@v4
        with:
          name: LOLDataSystem-full-bug-repair-safe-deploy
          path: |
            dist/*.zip
            dist/*.metadata.json
          if-no-files-found: error
          retention-days: 14
