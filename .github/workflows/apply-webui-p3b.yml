name: Apply tested WEBUI P3B patch

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - .github/p3b-patch/ready

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Rebuild and verify patch
        shell: bash
        run: |
          cat .github/p3b-patch/part* > /tmp/p3b_patch.b64
          base64 --decode /tmp/p3b_patch.b64 | gzip --decompress > /tmp/p3b.patch
          test "$(wc -c < /tmp/p3b.patch)" = "91523"
          git apply --check /tmp/p3b.patch
          git apply /tmp/p3b.patch
          git diff --check
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate P3B candidate
        shell: bash
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p "test_*.py" -v
          python tests/check_ui_assets.py
          node --check lanzou_update_push_api_server/control_ui/assets/configuration.js
      - name: Commit tested implementation and remove one-time payload
        shell: bash
        run: |
          rm -rf .github/p3b-patch
          rm -f .github/workflows/apply-webui-p3b.yml
          rm -f ui_control.generated.js ui_lolban_console.generated.js ui_parser_center.generated.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(webui): migrate P3B configuration and debugger pages"
          git push origin HEAD:feat/webui-control-panel-003-20260805
