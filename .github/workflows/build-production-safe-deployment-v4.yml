name: Build production safe deployment package V4

on:
  push:
    branches:
      - release/full-bug-repair-safe-deploy-masterline-v4-20260801
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-package-v4:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET_COMMIT: 330d286ce953e47950f7f4eab13a43d4d34eb5e7

    steps:
      - name: Checkout V4 builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify official masterline target
        shell: pwsh
        run: |
          git cat-file -e "$env:TARGET_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Target commit is unavailable." }
          $master = (git rev-parse origin/master).Trim()
          if ($master -ne $env:TARGET_COMMIT) {
            throw "Pinned target is not the current official master commit. master=$master target=$env:TARGET_COMMIT"
          }
          git merge-base --is-ancestor 3dcebd0a6ddde4425796e0516f0af93f1360896e $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Target is not descended from the previously released masterline commit."
          }
          git worktree add --detach candidate-v4 $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Unable to create immutable target worktree." }

      - name: Install target dependencies and audit tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r candidate-v4/requirements.txt
          python -m pip install pip-audit

      - name: Run immutable target tests
        shell: pwsh
        run: |
          Push-Location candidate-v4
          try {
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests -p "test_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Parse every target script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem candidate-v4 -Filter *.ps1 -File -Recurse)
          if ($files.Count -eq 0) { throw "No PowerShell files were found." }
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
                  exit 1
              }
          }
          Write-Host "Windows PowerShell 5.1 parsed $($files.Count) scripts successfully."

      - name: Audit target dependency set
        shell: pwsh
        run: python -m pip_audit -r candidate-v4/requirements.txt --strict

      - name: Build V4 immutable offline deployment package
        shell: powershell
        run: |
          .\ops\Build-FullBugRepairPackageV4.ps1 `
              -RepositoryRoot "$pwd" `
              -TargetCommit "$env:TARGET_COMMIT" `
              -OutputRoot "$pwd\dist-v4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify V4 package hashes and safety flags
        shell: pwsh
        run: |
          $metadataFile = Get-ChildItem dist-v4 -Filter *.metadata.json -File | Select-Object -First 1
          $zipFile = Get-ChildItem dist-v4 -Filter *.zip -File | Select-Object -First 1
          if (-not $metadataFile -or -not $zipFile) { throw "V4 package files are missing." }

          $metadata = Get-Content $metadataFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($metadata.target_commit)" -ne $env:TARGET_COMMIT) { throw "V4 target mismatch." }
          if ([int]$metadata.package_revision -ne 4) { throw "V4 revision mismatch." }
          if (-not [bool]$metadata.official_masterline_target) { throw "Official masterline flag is missing." }
          if (-not [bool]$metadata.ancestry_guard_preserved) { throw "Ancestry guard flag is missing." }
          $zipHash = (Get-FileHash $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "$($metadata.zip_sha256)".ToLowerInvariant()) { throw "V4 ZIP hash mismatch." }

          $extract = Join-Path $env:RUNNER_TEMP "full-bug-repair-v4-final"
          if (Test-Path -LiteralPath $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath $extract -Force
          $manifestFile = Get-ChildItem $extract -Filter manifest.json -File -Recurse | Select-Object -First 1
          if (-not $manifestFile) { throw "V4 manifest is missing." }
          $manifest = Get-Content $manifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ("$($manifest.target_commit)" -ne $env:TARGET_COMMIT) { throw "Embedded target mismatch." }
          if ([int]$manifest.package_revision -ne 4) { throw "Embedded revision mismatch." }
          foreach ($flag in @(
            "candidate_tests_before_stop",
            "automatic_rollback",
            "offline_dependencies",
            "powershell_utf8_parse_input",
            "official_masterline_target",
            "ancestry_guard_preserved"
          )) {
            if (-not [bool]$manifest.deployment.$flag) { throw "Missing safety flag: $flag" }
          }
          foreach ($entry in @($manifest.files)) {
            $path = Join-Path $manifestFile.Directory.FullName ("$($entry.path)".Replace("/", "\"))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing file: $($entry.path)" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne "$($entry.sha256)".ToLowerInvariant()) {
              throw "File hash mismatch: $($entry.path)"
            }
            if ([int64](Get-Item $path).Length -ne [int64]$entry.bytes) { throw "File size mismatch: $($entry.path)" }
          }
          $deployFile = Join-Path $manifestFile.Directory.FullName "Deploy-FullBugRepairSafe.ps1"
          $deployText = Get-Content $deployFile -Raw -Encoding UTF8
          foreach ($marker in @(
            "Parser]::ParseInput(",
            "Current production commit is not an ancestor of the package target",
            "Production was not stopped or changed",
            "Automatic rollback is starting"
          )) {
            if (-not $deployText.Contains($marker)) { throw "Deployment marker is missing: $marker" }
          }
          Get-Content $metadataFile.FullName -Raw

      - name: Upload V4 production deployment package
        uses: actions/upload-artifact@v4
        with:
          name: LOLDataSystem-full-bug-repair-safe-deploy-masterline-v4
          path: |
            dist-v4/*.zip
            dist-v4/*.metadata.json
          if-no-files-found: error
          retention-days: 14
