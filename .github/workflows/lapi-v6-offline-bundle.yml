name: lapi-v6-offline-bundle

on:
  pull_request:
    branches:
      - release/lapi-query-hardening-20260729
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify offline Git bundle
        shell: bash
        run: |
          set -euo pipefail
          target="8de85a855b8338c3a9a69cbb2a937cd0a6ef8b82"
          git cat-file -e "${target}^{commit}"
          git branch --force lapi-v6-offline-target "$target"
          mkdir -p artifact
          git bundle create artifact/lapi-v6-offline.bundle lapi-v6-offline-target
          git bundle verify artifact/lapi-v6-offline.bundle
          git clone --branch lapi-v6-offline-target artifact/lapi-v6-offline.bundle verify-repository
          test "$(git -C verify-repository rev-parse HEAD)" = "$target"
          sha256sum artifact/lapi-v6-offline.bundle > artifact/lapi-v6-offline.bundle.sha256
          printf '%s\n' "$target" > artifact/TARGET_COMMIT.txt

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: lapi-v6-offline-bundle
          path: artifact/
          if-no-files-found: error
          retention-days: 7
