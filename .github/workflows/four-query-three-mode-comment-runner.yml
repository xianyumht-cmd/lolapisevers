name: Four query comment runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.issue.pull_request && github.event.issue.number == 24 && github.event.comment.body == '/run-four-query-three-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/four-query-three-mode-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute reviewed implementation block
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/four-query-three-mode-once.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Implement API image/text/forward support')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          block = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              block.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(block), str(path), 'exec'), {'__name__': '__main__'})
      - name: Verify complete API suite
        run: |
          python -m pip install -r requirements.txt
          python -m unittest tests.test_groupguard_four_query_three_mode
          python -m unittest discover -s tests
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/four-query-three-mode-once.yml
          rm -f docs/four-query-three-mode.trigger docs/four-query-three-mode.trigger2 docs/four-query-three-mode.trigger3 docs/four-query-three-mode.trigger4
          git add -A
          git commit -m "feat(query): add three-mode delivery for four query features"
          git push origin HEAD:codex/four-query-three-mode-20260730
