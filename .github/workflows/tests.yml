name: tests

on:
  pull_request:
    branches:
      - master
      - codex/production-integration-audit-20260726
      - docs/intranet-query-boundary-20260728
      - "feat/**"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p3b-url-mask-followup:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/webui-control-panel-003-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Repair encoded mask detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lanzou_update_push_api_server/management.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _merge_masked_query_url(candidate: str, previous: str, name: str) -> str:\n    if "***" not in candidate:\n        return candidate\n    if not previous:\n        raise ValueError(f"{name} contains a masked value but no previous URL exists")\n    candidate_parts = urlsplit(candidate)\n    previous_parts = urlsplit(previous)'''
          new = '''def _merge_masked_query_url(candidate: str, previous: str, name: str) -> str:\n    candidate_parts = urlsplit(candidate)\n    candidate_pairs = parse_qsl(candidate_parts.query, keep_blank_values=True)\n    if not any(value == "***" for _, value in candidate_pairs):\n        return candidate\n    if not previous:\n        raise ValueError(f"{name} contains a masked value but no previous URL exists")\n    previous_parts = urlsplit(previous)'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'candidate_pairs = parse_qsl(candidate_parts.query' not in text:
              raise SystemExit('encoded-mask helper anchor not found')
          text = text.replace(
              '    for key, value in parse_qsl(candidate_parts.query, keep_blank_values=True):\n',
              '    for key, value in candidate_pairs:\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_api_debugger.py' -v
          python -m unittest discover -s tests -p 'test_control_ui_configuration.py' -v
          node --check lanzou_update_push_api_server/control_ui/assets/configuration.js
          git diff --check

      - name: Commit follow-up fix
        shell: bash
        run: |
          git add lanzou_update_push_api_server/management.py
          if git diff --cached --quiet; then
            echo "Encoded URL mask fix already present."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(webui): preserve encoded URL query masks"
          git push origin HEAD:feat/webui-control-panel-003-20260805

  linux-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-unittest:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        shell: pwsh
        run: python -m compileall -q .

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Generate WebUI JavaScript
        id: generate_ui
        continue-on-error: true
        shell: pwsh
        run: |
          python tests/check_ui_assets.py 2>&1 | Tee-Object -FilePath ui-generation-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate WebUI JavaScript
        id: node_check
        if: steps.generate_ui.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          node --check ui_control.generated.js 2>&1 | Tee-Object -FilePath node-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WebUI syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-syntax-diagnostics
          path: |
            ui_control.generated.js
            node-check.txt
            ui-generation-error.txt
            ui-generation-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail on WebUI generation error
        if: steps.generate_ui.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content ui-generation-output.txt -Raw | Write-Error
          exit 1

      - name: Fail on WebUI syntax error
        if: steps.node_check.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content node-check.txt -Raw | Write-Error
          exit 1

      - name: Validate every PowerShell script
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]\.venv[\\/]' }
          if ($files.Count -eq 0) {
            Write-Error "No PowerShell scripts found"
            exit 1
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts successfully."

      - name: Remove generated diagnostics
        if: always()
        shell: pwsh
        run: Remove-Item ui_control.generated.js,node-check.txt,ui-generation-error.txt,ui-generation-output.txt -Force -ErrorAction SilentlyContinue

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tool and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit dependency set
        run: python -m pip_audit --strict
