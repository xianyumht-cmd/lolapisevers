name: temporary full bug audit 2026-08-01

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit

      - name: Compile all Python sources
        continue-on-error: true
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv|artifact|target|ms-playwright)(/|$)' . 2>&1 | tee audit-compileall.txt

      - name: Run unit tests on Linux
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee audit-unittest-linux.txt

      - name: Run Ruff
        continue-on-error: true
        run: |
          ruff check . --output-format=json > audit-ruff.json

      - name: Run Bandit
        continue-on-error: true
        run: |
          bandit -r . -x ./tests,./artifact,./target,./ms-playwright -f json -o audit-bandit.json

      - name: Audit pinned dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt -f json -o audit-pip.json 2>&1 | tee audit-pip-console.txt

      - name: Generate repository risk inventory
        shell: python
        run: |
          import ast
          import json
          import re
          from pathlib import Path

          root = Path('.')
          ignored = {'.git', '.venv', 'venv', 'artifact', 'target', 'ms-playwright', '__pycache__'}
          source_exts = {'.py', '.ps1', '.bat', '.cmd', '.js', '.json', '.yml', '.yaml', '.html', '.md'}
          findings = []
          stats = {'files_scanned': 0, 'python_files': 0, 'powershell_files': 0, 'javascript_files': 0}

          def add(path, line, rule, severity, message):
              findings.append({
                  'path': path.as_posix(),
                  'line': int(line),
                  'rule': rule,
                  'severity': severity,
                  'message': message,
              })

          for path in sorted(root.rglob('*')):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              if path.suffix.lower() not in source_exts:
                  continue
              stats['files_scanned'] += 1
              if path.suffix.lower() == '.py': stats['python_files'] += 1
              if path.suffix.lower() == '.ps1': stats['powershell_files'] += 1
              if path.suffix.lower() == '.js': stats['javascript_files'] += 1
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              for idx, line in enumerate(text.splitlines(), 1):
                  lowered = line.lower()
                  if re.search(r'\b(todo|fixme|hack|xxx)\b', lowered):
                      add(path, idx, 'unfinished-marker', 'low', line.strip()[:300])
                  if re.search(r'(?i)(password|token|secret|cookie|api[_-]?key)\s*[:=]\s*["\'][^"\']{8,}["\']', line):
                      if 'change_me' not in lowered and 'example' not in path.name.lower():
                          add(path, idx, 'possible-secret-literal', 'high', 'Possible credential literal; value intentionally omitted')
                  if path.suffix.lower() == '.py' and re.match(r'^\s*except\s*:\s*$', line):
                      add(path, idx, 'bare-except', 'medium', 'Bare except can hide process-control and data errors')
                  if path.suffix.lower() == '.py' and re.search(r'\bverify\s*=\s*False\b', line):
                      add(path, idx, 'tls-verification-disabled', 'high', 'TLS certificate verification disabled')
                  if path.suffix.lower() == '.py' and re.search(r'\b(eval|exec)\s*\(', line):
                      add(path, idx, 'dynamic-code-execution', 'high', 'Dynamic code execution requires manual review')
                  if path.suffix.lower() in {'.ps1', '.bat', '.cmd'} and re.search(r'(?i)executionpolicy\s+bypass', line):
                      add(path, idx, 'execution-policy-bypass', 'low', 'Expected in launchers but broadens script execution surface')

              if path.suffix.lower() == '.py':
                  try:
                      tree = ast.parse(text, filename=str(path))
                  except SyntaxError as exc:
                      add(path, exc.lineno or 1, 'python-syntax-error', 'critical', str(exc))
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ExceptHandler) and isinstance(node.type, ast.Name) and node.type.id == 'Exception':
                          if len(node.body) == 1 and isinstance(node.body[0], ast.Pass):
                              add(path, node.lineno, 'swallowed-exception', 'high', 'Exception is silently swallowed')
                      if isinstance(node, ast.Call):
                          name = ''
                          if isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name):
                              name = f'{node.func.value.id}.{node.func.attr}'
                          elif isinstance(node.func, ast.Name):
                              name = node.func.id
                          if name in {'requests.get', 'requests.post', 'requests.put', 'requests.patch', 'requests.delete', 'requests.request'}:
                              if not any(keyword.arg == 'timeout' for keyword in node.keywords):
                                  add(path, node.lineno, 'requests-without-timeout', 'high', f'{name} has no timeout')
                          if name in {'subprocess.run', 'subprocess.call', 'subprocess.Popen', 'subprocess.check_call', 'subprocess.check_output'}:
                              for keyword in node.keywords:
                                  if keyword.arg == 'shell' and isinstance(keyword.value, ast.Constant) and keyword.value.value is True:
                                      add(path, node.lineno, 'subprocess-shell-true', 'high', 'shell=True requires injection review')

          result = {
              'schema': 'lolapisevers-full-bug-audit-scan.v1',
              'git_ref': '${{ github.sha }}',
              'stats': stats,
              'finding_count': len(findings),
              'findings': findings,
          }
          Path('audit-repository.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'stats': stats, 'finding_count': len(findings)}, ensure_ascii=False))

      - name: Upload Linux audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-bug-audit-linux
          path: |
            audit-*.json
            audit-*.txt
          if-no-files-found: warn

  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests on Windows
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *>&1 | Tee-Object -FilePath audit-unittest-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse every PowerShell script
        continue-on-error: true
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch '[\\/](\.git|\.venv|venv|artifact|target)[\\/]'
          } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              $allErrors += [pscustomobject]@{
                path = $_.FullName.Substring($PWD.Path.Length + 1)
                line = $error.Extent.StartLineNumber
                column = $error.Extent.StartColumnNumber
                message = $error.Message
              }
            }
          }
          $allErrors | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 audit-powershell-syntax.json
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-Table -AutoSize
            exit 1
          }

      - name: Validate generated WebUI JavaScript
        continue-on-error: true
        shell: pwsh
        run: |
          python tests/check_ui_assets.py *>&1 | Tee-Object -FilePath audit-webui-assets.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-bug-audit-windows
          path: |
            audit-*.json
            audit-*.txt
          if-no-files-found: warn
