name: WEBUI-IOS-001 temporary runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 25 &&
      github.event.comment.user.login == 'xianyumht-cmd' &&
      github.event.comment.body == '/run-webui-ios-001'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/webui-ios-glass-20260730
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Connect shared theme to runtime dashboard
        shell: python
        run: |
          import json
          from pathlib import Path

          runtime = Path('lanzou_update_push_api_server/ui_runtime.py')
          source = runtime.read_text(encoding='utf-8')
          import_marker = 'from .ui_control import render_control_dashboard\n'
          import_replacement = import_marker + 'from .ui_theme import apply_ios_glass_theme\n'
          if 'from .ui_theme import apply_ios_glass_theme' not in source:
              if import_marker not in source:
                  raise SystemExit('ui_runtime import marker not found')
              source = source.replace(import_marker, import_replacement, 1)
          if 'return apply_ios_glass_theme(page)' not in source:
              marker = '    return page\n'
              if source.count(marker) != 1:
                  raise SystemExit(f'ui_runtime return marker count={source.count(marker)}')
              source = source.replace(marker, '    return apply_ios_glass_theme(page)\n', 1)
          runtime.write_text(source, encoding='utf-8')

          state_path = Path('docs/WEBUI_IOS_GLASS_001_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['progress_percent'] = 65
          state['updated_at'] = '2026-07-30T22:20:00+08:00'
          state['current_step'] = 'Run full API and WebUI verification'
          state['phases']['implementation'] = 'COMPLETED'
          state['phases']['verification'] = 'IN_PROGRESS'
          state['completed'].extend([
              'Added shared iOS glass theme module',
              'Injected theme into final runtime dashboard HTML',
              'Added light, dark and system theme contract tests'
          ])
          state['remaining'] = [
              'Run full CI',
              'Merge to master and mark COMPLETED'
          ]
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Verify complete service and WebUI suite
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python tests/check_ui_assets.py
          node --check ui_control.generated.js

      - name: Commit verified implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lanzou_update_push_api_server/ui_runtime.py docs/WEBUI_IOS_GLASS_001_STATE.json
          git commit -m "feat(webui): connect iOS glass theme to runtime dashboard"
          git push origin HEAD:codex/webui-ios-glass-20260730
