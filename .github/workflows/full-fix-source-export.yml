name: Full fix source export

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: full-fix-source
          path: .
          include-hidden-files: true
          retention-days: 1
