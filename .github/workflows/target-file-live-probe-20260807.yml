name: Target file live probe 20260807

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Probe actual Lanzou share
        env:
          LANZOU_API_KEY: ${{ secrets.LANZOU_API_KEY }}
          TARGET_URL: https://wwbvf.lanzn.com/b016kzvvmd
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit
          import requests
          from lanzou_update_push_api_server.config import WatcherConfig, load_config
          from lanzou_update_push_api_server.providers import LanzouWebProvider, WerApiProvider

          url = os.environ['TARGET_URL']
          cfg = load_config()
          watcher = WatcherConfig(id='live-probe', title='live-probe', url=url, enabled=True, max_pages=5)
          snapshot = LanzouWebProvider().fetch(watcher, cfg)
          print('PROBE_STATUS=ok')
          print(f'PROVIDER={snapshot.provider}')
          print(f'FILE_COUNT={len(snapshot.files)}')
          for index, item in enumerate(snapshot.files[:20], start=1):
              safe_name = re.sub(r'[\r\n\x00-\x1f]+', ' ', str(item.name or ''))[:180]
              safe_size = re.sub(r'[\r\n\x00-\x1f]+', ' ', str(item.size or ''))[:80]
              safe_time = re.sub(r'[\r\n\x00-\x1f]+', ' ', str(item.modified_time or ''))[:80]
              print(f'FILE_{index}_NAME={safe_name}')
              print(f'FILE_{index}_SIZE={safe_size}')
              print(f'FILE_{index}_TIME={safe_time}')

          if not cfg.wer_api_key:
              print('DIRECT_PROBE=skipped_no_action_secret')
              raise SystemExit(0)

          resolved = WerApiProvider().fetch(watcher, cfg)
          print(f'WER_FILE_COUNT={len(resolved.files)}')
          candidate = None
          for item in resolved.files:
              raw = item.raw if isinstance(item.raw, dict) else {}
              for key in ('downurl', 'download', 'file_url', 'download_url', 'url', 'link'):
                  value = str(raw.get(key) or '').strip()
                  if value.startswith(('http://', 'https://')) and value.rstrip('/') != url.rstrip('/'):
                      candidate = value
                      break
              if candidate:
                  break
          if not candidate:
              print('DIRECT_PROBE=no_candidate')
              raise SystemExit(0)
          parts = urlsplit(candidate)
          print(f'DIRECT_CANDIDATE_HOST={parts.hostname or ""}')
          print(f'DIRECT_CANDIDATE_PATH={parts.path[:160]}')
          with requests.get(candidate, stream=True, timeout=20, allow_redirects=True, headers={'User-Agent':'Mozilla/5.0'}) as response:
              response.raise_for_status()
              first = next(response.iter_content(chunk_size=1024), b'')
              final = urlsplit(response.url)
              print(f'DIRECT_PROBE=ok status={response.status_code} first_bytes={len(first)} final_host={final.hostname or ""}')
          PY
