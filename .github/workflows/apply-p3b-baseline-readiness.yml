name: Apply P3B baseline-aware readiness patch

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - .patches/p3b-baseline-readiness/**
      - .github/workflows/apply-p3b-baseline-readiness.yml

permissions:
  contents: write

concurrency:
  group: p3b-baseline-readiness-apply
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/webui-control-panel-003-20260805

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Reconstruct and verify immutable patch
        shell: pwsh
        run: |
          $partNames = @(
            "part00.txt",
            "part01.txt",
            "part02.txt",
            "part03.txt",
            "part04a.txt",
            "part04b.txt",
            "part05.txt"
          )
          $encoded = ""
          foreach ($name in $partNames) {
            $path = Join-Path ".patches/p3b-baseline-readiness" $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing patch part: $name"
            }
            $encoded += (Get-Content -LiteralPath $path -Raw -Encoding ASCII).Trim()
          }
          $bytes = [Convert]::FromBase64String($encoded)
          if ($bytes.Length -ne 13895) {
            throw "Patch byte length mismatch: $($bytes.Length)"
          }
          $patchPath = Join-Path $env:RUNNER_TEMP "p3b-baseline-readiness.patch"
          [IO.File]::WriteAllBytes($patchPath, $bytes)
          $hash = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "8e223c18994b16ef4b2c6b5db2c4e9906b9b22906aab067b4c44db63ed24aa4e") {
            throw "Patch SHA-256 mismatch: $hash"
          }
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = @(git diff --name-only | Sort-Object)
          $expected = @(
            ".github/workflows/build-production-safe-deployment-v3.yml",
            "ops/Build-FullBugRepairPackageV3.ps1"
          ) | Sort-Object
          if (@(Compare-Object $expected $actual).Count -ne 0) {
            throw "Unexpected patched files: $($actual -join ', ')"
          }
          if (-not (Test-Path -LiteralPath "tests/test_v3_baseline_readiness.py" -PathType Leaf)) {
            throw "Tracked baseline-readiness regression test is missing."
          }

      - name: Install dependencies and audit tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Run complete safety gate
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_ui_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui_control.generated.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit -r requirements.txt --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Filter *.ps1 -File -Recurse)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $text = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
            [System.Management.Automation.Language.Parser]::ParseInput(
              $text,
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
          }

      - name: Commit verified source and remove temporary payload
        shell: pwsh
        run: |
          git checkout cacb56691445ed83f78656eb3b23cb413811b6ed -- .github/workflows/tests.yml
          Remove-Item -LiteralPath ".patches/p3b-baseline-readiness" -Recurse -Force
          Remove-Item -LiteralPath ".github/workflows/apply-p3b-baseline-readiness.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix(deploy): compare readiness against pre-switch baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feat/webui-control-panel-003-20260805
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
