name: LOL2099 read-only integration probe

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/lol2099-readonly-probe.yml
      - tools/lol2099_readonly_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Run read-only browser/network probe
        run: python tools/lol2099_readonly_probe.py
      - name: Upload sanitized probe report
        uses: actions/upload-artifact@v4
        with:
          name: lol2099-readonly-probe
          path: lol2099-readonly-probe.json
          retention-days: 3
