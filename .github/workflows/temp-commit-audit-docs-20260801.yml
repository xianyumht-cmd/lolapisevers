name: temporary commit audit docs 2026-08-01

on:
  push:
    branches:
      - audit/full-bug-inventory-20260801
    paths:
      - .github/workflows/temp-commit-audit-docs-20260801.yml

permissions:
  contents: write

jobs:
  commit-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-bug-inventory-20260801
          fetch-depth: 0

      - name: Generate durable audit documents
        env:
          AUDIT_JSON_GZ_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          raw = gzip.decompress(base64.b64decode(os.environ['AUDIT_JSON_GZ_B64']))
          data = json.loads(raw.decode('utf-8'))
          out = Path('docs/audits')
          out.mkdir(parents=True, exist_ok=True)
          json_path = out / '2026-08-01-full-bug-inventory.json'
          json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status_zh = {
              'CONFIRMED': '已确认',
              'PROBABLE': '高概率',
              'DESIGN_RISK': '设计风险',
              'DEPENDENCY': '依赖漏洞',
              'CONDITIONAL': '条件风险',
          }
          lines = [
              '# lolapisevers 全仓 Bug 清单（2026-08-01）',
              '',
              '审查结论：**本次基线共登记 37 项问题，全部标记为 `OPEN`：P1 10 项、P2 21 项、P3 6 项。**',
              '',
              '机器事实源：[2026-08-01-full-bug-inventory.json](./2026-08-01-full-bug-inventory.json)。',
              '',
              '## 审查基线',
              '',
              '- 仓库：`xianyumht-cmd/lolapisevers`',
              '- 分支：`master`',
              f"- SHA：`{data['audited_base_sha']}`",
              f"- 审计分支：`{data['audit_branch']}`",
              f"- PR：`#{data['pull_request']}`",
              '- 范围：主 API、查询协议和官方客户端、蓝奏监控/WebUI、SQLite/MySQL、上游 HTTP、PowerShell 运维、依赖与测试。',
              '',
              '> 这里的“全仓”指本次基线、静态检查、跨文件调用链和最小复现能够识别的全部问题，不是对未来代码或不可达生产环境绝对无其他缺陷的证明。',
              '',
              '## 审计结果',
              '',
              '| 检查 | 结果 |',
              '|---|---|',
              '| Linux 单元测试 | 227 通过，2 跳过 |',
              '| Windows 单元测试 | 227 通过 |',
              '| Python compileall | 通过 |',
              '| 全仓 PowerShell 语法 | 通过 |',
              '| 生成后的 WebUI JavaScript | 通过 |',
              '| Ruff / Bandit | 已人工复核并剔除误报 |',
              '| pip-audit | 失败：5 个包、31 个唯一公告 |',
              '',
              '现有测试全部通过，但没有覆盖并发不同参数、旧路由兼容、跨端大小限制、匿名写入和部署失败回滚等场景。',
              '',
              '## 总览',
              '',
              '| ID | 级别 | 状态 | 问题 | 批次 |',
              '|---|---:|---|---|---:|',
          ]
          for finding in data['findings']:
              lines.append(
                  f"| `{finding['id']}` | **{finding['severity']}** | "
                  f"{status_zh[finding['status']]} | {finding['title']} | {finding['fix_batch']} |"
              )
          lines.extend(['', '## 详细登记', ''])
          for finding in data['findings']:
              refs = '；'.join(f"`{value}`" for value in finding['references'])
              lines.extend([
                  f"### {finding['id']} · {finding['severity']} · {status_zh[finding['status']]}：{finding['title']}",
                  '',
                  f"- 状态：`OPEN`；组件：`{finding['component']}`；位置：{refs}",
                  f"- 证据与影响：{finding['evidence']} {finding['impact']}",
                  f"- 修复与验收：{finding['fix']} 回归测试：{finding['regression_test']}",
                  f"- 计划：`BATCH-{finding['fix_batch']}`",
                  '',
              ])
          dependency = next(item for item in data['findings'] if item['id'] == 'DEP-001')
          lines.extend([
              '## 依赖漏洞摘要',
              '',
              '`DEP-001` 是版本级事实，并不表示所有公告都能从本项目路径直接利用；升级后仍需做可达性与兼容性验证。',
              '',
              '| 包 | 当前版本 | 唯一公告数 | 修复全部本次公告的观察下限 |',
              '|---|---:|---:|---|',
          ])
          for item in dependency['dependency_summary']:
              lines.append(
                  f"| `{item['package']}` | `{item['version']}` | {item['unique_advisories']} | "
                  f"`{item['minimum_observed_fix']}` |"
              )
          lines.extend([
              '',
              '## 已排除的扫描误报',
              '',
              '- `db.py` 的动态 WHERE 由固定片段组成，值仍使用参数绑定，未按 SQL 注入登记。',
              '- 部分 requests timeout 通过变量或 kwargs 传入，扫描器无法识别；已逐处人工核对。',
              '- SHA-1 仅用于非安全缓存/同步指纹，不用于认证或签名。',
              '- 宽泛异常捕获多数属于降级、截图和审计容错；只有影响正确性的路径被登记。',
              '- PowerShell `ExecutionPolicy Bypass` 本身是当前启动方式；供应链、误杀和回滚问题已单独登记。',
              '',
              '## 修复顺序',
              '',
          ])
          for batch in data['recommended_fix_order']:
              lines.extend([
                  f"### BATCH-{batch['batch']}：{batch['goal']}",
                  '',
                  '、'.join(f"`{value}`" for value in batch['finding_ids']),
                  '',
              ])
          lines.extend([
              '每批必须执行：新增失败测试 → 最小修复 → Windows/Linux 全量测试 → WebUI JS 检查 → 隔离实机验收 → 再部署。',
              '',
              '## 尚需实机验证',
              '',
              '1. 真实 MySQL 初始化、断线、慢查询和配置边界。',
              '2. 真实 SO1 登录态、过期 cookie、验证码、同名不同 tag 和跨重试延迟响应。',
              '3. 真实蓝奏/WER 样本、Provider 切换、空列表保护和热更新竞态。',
              '4. SnowLuma/NapCat 对 text/image/forward、Base64 和失败回退的消费边界。',
              '5. 隔离 Windows 虚拟机中的 NSSM 安装失败回滚、服务接管误杀保护和任务计划恢复。',
              '6. 多并发、重启、磁盘写满和超大响应故障注入。',
              '',
              '## 关闭条件',
              '',
              '问题只有在“旧代码可稳定复现、修复测试先行、全量测试通过、相关文档同步、P1/竞态/PowerShell 项完成实机验收、提交与部署可追溯”全部满足后，才可从 `OPEN` 改为 `FIXED`。',
              '',
          ])
          (out / '2026-08-01-full-bug-inventory.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Validate generated documents
        run: |
          python -m json.tool docs/audits/2026-08-01-full-bug-inventory.json >/dev/null
          grep -q 'GG-001' docs/audits/2026-08-01-full-bug-inventory.md
          grep -q 'SEC-002' docs/audits/2026-08-01-full-bug-inventory.md
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('docs/audits/2026-08-01-full-bug-inventory.json', encoding='utf-8'))['findings']))
          PY
          )" = '37'

      - name: Commit documents
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audits/2026-08-01-full-bug-inventory.md docs/audits/2026-08-01-full-bug-inventory.json
          git commit -m 'docs(audit): record full bug inventory for 2026-08-01'
          git push origin HEAD:audit/full-bug-inventory-20260801
