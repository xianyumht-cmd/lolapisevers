name: Apply P0 runtime status fix

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - tools/apply_p0_runtime_fix.py
      - .github/workflows/apply-p0-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply reviewed patch
        run: python tools/apply_p0_runtime_fix.py
      - name: Compile and run full tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate every WebUI script
        run: |
          python tests/check_ui_assets.py
          node --check ui_control.generated.js
          node --check ui_lolban_console.generated.js
          node --check ui_parser_center.generated.js
      - name: Remove one-time patch files and commit
        run: |
          rm -f tools/apply_p0_runtime_fix.py .github/workflows/apply-p0-runtime-fix.yml
          rm -f ui_control.generated.js ui_lolban_console.generated.js ui_parser_center.generated.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(webui): correct control health and restore runtime secrets"
          git push origin HEAD:feat/webui-control-panel-003-20260805
