name: LAPI Parser Center CI

on:
  pull_request:
    paths:
      - "services/**"
      - "lanzou_update_push_api_server/**"
      - "config/interface-parser-center.default.json"
      - "tests/**"
      - ".github/workflows/lapi-parser-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q services lanzou_update_push_api_server tests
      - name: Validate parser default JSON
        run: python -m json.tool config/interface-parser-center.default.json > /dev/null
      - name: Run parser center tests
        run: python -m unittest -v tests.test_api_parser_center tests.test_lolban_reason_output
      - name: Run full suite
        run: python -m unittest discover -s tests -v
