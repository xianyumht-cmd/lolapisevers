name: Apply provider-local Secret UI

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - tools/apply_provider_local_secret_ui.py
      - .github/workflows/apply-provider-local-secret-ui.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Repair and compile one-time patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_provider_local_secret_ui.py")
          text = path.read_text(encoding="utf-8")

          bad_regex = "        r'''\\n_LOLBAN_SECRET_PANEL = r'''.*?\\n\\ndef select_parser_center_section''',"
          good_regex = "        r\"\\n_LOLBAN_SECRET_PANEL = r'''.*?\\n\\ndef select_parser_center_section\","
          if bad_regex in text:
              text = text.replace(bad_regex, good_regex, 1)

          start_marker = "    replace_once(\n        path,\n        '''function setState(d)"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("setState patch block start is missing")
          end = text.find("\n    )", start)
          if end < 0:
              raise SystemExit("setState patch block end is missing")
          end += len("\n    )")
          stable_block = "\n".join([
              "    replace_once(",
              "        path,",
              "        \"S.runtime=runtime;$('parserPath')\",",
              "        \"S.runtime=runtime;S.providerSecrets=d.provider_secrets||{};$('parserPath')\",",
              "    )",
          ])
          text = text[:start] + stable_block + text[end:]

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile tools/apply_provider_local_secret_ui.py
      - name: Apply reviewed patch
        run: python tools/apply_provider_local_secret_ui.py
      - name: Correct provider-local UI assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          console_test = Path("tests/test_lolban_query_console.py")
          text = console_test.read_text(encoding="utf-8")
          for line in [
              '        self.assertIn("LOLMAP_API_TOKEN", page)\n',
              '        self.assertIn("LOL_BAN_4PNG_TOKEN", page)\n',
          ]:
              if line not in text:
                  raise SystemExit(f"console assertion missing: {line.strip()}")
              text = text.replace(line, "", 1)
          anchor = '        self.assertIn("/admin/query-console/lolban/provider-secret", page)\n'
          if anchor not in text:
              raise SystemExit("console endpoint assertion missing")
          additions = (
              '        self.assertIn("data-secret-provider", page)\n'
              '        self.assertIn("providerSecrets", page)\n'
          )
          text = text.replace(anchor, additions + anchor, 1)
          console_test.write_text(text, encoding="utf-8")

          navigation_test = Path("tests/test_control_navigation.py")
          text = navigation_test.read_text(encoding="utf-8")
          for line in [
              "        self.assertIn('主接口 Token', page)\n",
              "        self.assertIn('LOLMAP_API_TOKEN', page)\n",
              "        self.assertIn('4PNG Token', page)\n",
              "        self.assertIn('LOL_BAN_4PNG_TOKEN', page)\n",
          ]:
              if line not in text:
                  raise SystemExit(f"navigation assertion missing: {line.strip()}")
              text = text.replace(line, "", 1)
          anchor = "        self.assertIn('/admin/query-console/lolban/provider-secret', page)\n"
          if anchor not in text:
              raise SystemExit("navigation endpoint assertion missing")
          additions = (
              "        self.assertIn('data-secret-provider', page)\n"
              "        self.assertIn('providerSecrets', page)\n"
          )
          text = text.replace(anchor, additions + anchor, 1)
          navigation_test.write_text(text, encoding="utf-8")
          PY
      - name: Compile and run full tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate final WebUI JavaScript
        run: |
          python tests/check_ui_assets.py
          node --check ui_control.generated.js
          node --check ui_lolban_console.generated.js
          node --check ui_parser_center.generated.js
      - name: Commit only reviewed source changes
        run: |
          rm -f tools/apply_provider_local_secret_ui.py .github/workflows/apply-provider-local-secret-ui.yml
          rm -f ui_control.generated.js ui_lolban_console.generated.js ui_parser_center.generated.js
          rm -f config/interface-parser-center.json data/contact_risk.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routers/query_admin.py \
            lanzou_update_push_api_server/lolban_console.py \
            lanzou_update_push_api_server/control_navigation.py \
            tests/test_lolban_query_console.py \
            tests/test_control_navigation.py
          git add -u tools/apply_provider_local_secret_ui.py .github/workflows/apply-provider-local-secret-ui.yml
          git diff --cached --check
          git commit -m "fix(webui): configure Provider Secrets beside each interface"
          git push origin HEAD:feat/webui-control-panel-003-20260805
