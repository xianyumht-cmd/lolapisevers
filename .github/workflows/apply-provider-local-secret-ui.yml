name: Apply provider-local Secret UI

on:
  push:
    branches:
      - feat/webui-control-panel-003-20260805
    paths:
      - tools/apply_provider_local_secret_ui.py
      - .github/workflows/apply-provider-local-secret-ui.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-control-panel-003-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply reviewed patch
        run: python tools/apply_provider_local_secret_ui.py
      - name: Compile and run full tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate final WebUI JavaScript
        run: |
          python tests/check_ui_assets.py
          node --check ui_control.generated.js
          node --check ui_lolban_console.generated.js
          node --check ui_parser_center.generated.js
      - name: Commit only reviewed source changes
        run: |
          rm -f tools/apply_provider_local_secret_ui.py .github/workflows/apply-provider-local-secret-ui.yml
          rm -f ui_control.generated.js ui_lolban_console.generated.js ui_parser_center.generated.js
          rm -f config/interface-parser-center.json data/contact_risk.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routers/query_admin.py \
            lanzou_update_push_api_server/lolban_console.py \
            lanzou_update_push_api_server/control_navigation.py \
            tests/test_lolban_query_console.py \
            tests/test_control_navigation.py
          git add -u tools/apply_provider_local_secret_ui.py .github/workflows/apply-provider-local-secret-ui.yml
          git diff --cached --check
          git commit -m "fix(webui): configure Provider Secrets beside each interface"
          git push origin HEAD:feat/webui-control-panel-003-20260805
