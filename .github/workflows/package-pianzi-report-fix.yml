name: Package pianzi report integration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'release/pianzi-report-package-20260804'
    runs-on: ubuntu-latest
    env:
      TARGET_COMMIT: a10e19db060780b829e9d738017a0fdce9dc25c8
      ARTIFACT_NAME: lolapisevers-pianzi-report-a10e19db0607
    steps:
      - name: Checkout exact merged target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify exact target and tests provenance
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_COMMIT"
          git status --porcelain --untracked-files=all | tee /tmp/status.txt
          test ! -s /tmp/status.txt
          test -f services/parser_center_multipart.py
          test -f tests/test_parser_center_multipart.py
          python -m json.tool config/interface-parser-center.default.json >/dev/null

      - name: Build and verify immutable Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          ref="refs/heads/pianzi-report-release"
          git update-ref "$ref" "$TARGET_COMMIT"
          bundle="artifact/lolapisevers-pianzi-report-${TARGET_COMMIT}.bundle"
          git bundle create "$bundle" "$ref"
          git bundle verify "$bundle"
          sha256sum "$bundle" > "$bundle.sha256"
          git archive --format=tar.gz --prefix="lolapisevers-${TARGET_COMMIT}/" -o "artifact/lolapisevers-pianzi-report-${TARGET_COMMIT}.tar.gz" "$TARGET_COMMIT"
          sha256sum "artifact/lolapisevers-pianzi-report-${TARGET_COMMIT}.tar.gz" > "artifact/lolapisevers-pianzi-report-${TARGET_COMMIT}.tar.gz.sha256"

      - name: Generate immutable manifest
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifact')
          target = os.environ['TARGET_COMMIT']
          files = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == 'manifest.json':
                  continue
              data = path.read_bytes()
              files.append({
                  'name': path.name,
                  'size_bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema': 'lolapisevers-pianzi-report-package.v1',
              'target_commit': target,
              'source_pr': 36,
              'query_provider_unchanged': True,
              'report_provider_default_enabled': False,
              'production_deployer_must_preserve_local_config': True,
              'files': files,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

      - name: Verify manifest file hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifact')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['target_commit'] == 'a10e19db060780b829e9d738017a0fdce9dc25c8'
          for item in manifest['files']:
              path = root / item['name']
              assert path.is_file(), item['name']
              data = path.read_bytes()
              assert len(data) == item['size_bytes'], item['name']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['name']

      - name: Upload exact release inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
