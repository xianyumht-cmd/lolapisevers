name: cleanup video-free packaging artifacts

on:
  push:
    branches:
      - feat/all-query-delivery-hub-20260729
    paths:
      - .github/workflows/cleanup-video-free-packaging-artifacts-20260730.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-query-delivery-hub-20260729
          fetch-depth: 0

      - name: Remove committed temporary package outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact/loldata-video-free-offline-safe-deploy-f221b6464976.zip
          test -e target
          test -f ui_control.generated.js
          git rm -r artifact target ui_control.generated.js
          {
            printf '\n# One-shot release workspaces and generated checks\n'
            printf '/artifact/\n'
            printf '/target/\n'
            printf '/ui_control.generated.js\n'
          } >> .gitignore
          rm -f .github/workflows/cleanup-video-free-packaging-artifacts-20260730.yml
          git config user.name 'openai-gpt-5.6-thinking'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): clean temporary video-free package outputs'
          git push origin HEAD:feat/all-query-delivery-hub-20260729
