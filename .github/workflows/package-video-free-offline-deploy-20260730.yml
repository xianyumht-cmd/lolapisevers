name: package video-free offline deploy

on:
  push:
    branches:
      - feat/all-query-delivery-hub-20260729
    paths:
      - ops/Deploy-LapiVideoFreeOffline.ps1
      - .github/workflows/package-video-free-offline-deploy-20260730.yml

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: windows-2025
    env:
      TARGET_COMMIT: f221b64649763eb8d325d87348fd2f42f48a6485
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-query-delivery-hub-20260729
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Materialize exact release target
        shell: pwsh
        run: |
          git cat-file -e "$env:TARGET_COMMIT`^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Target commit is missing' }
          git worktree add target $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create target worktree' }
          if ((git -C target rev-parse HEAD).Trim() -ne $env:TARGET_COMMIT) { throw 'Target worktree mismatch' }

      - name: Install target dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r target/requirements.txt

      - name: Run complete target validation
        shell: pwsh
        run: |
          Push-Location target
          try {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
            python -m compileall -q .
            if ($LASTEXITCODE -ne 0) { throw 'Compileall failed' }
            python tests/check_ui_assets.py
            if ($LASTEXITCODE -ne 0) { throw 'WebUI generation failed' }
            node --check ui_control.generated.js
            if ($LASTEXITCODE -ne 0) { throw 'Generated JavaScript syntax failed' }
          } finally {
            Pop-Location
          }

      - name: Validate deployment PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(
            'ops/Deploy-LapiVideoFreeOffline.ps1',
            'target/ops/Deploy-LapiQueryHardening.ps1',
            'target/ops/Rollback-LapiQueryHardening.ps1',
            'target/ops/Test-LapiQueryHardening.ps1',
            'target/ops/remove-retired-video-provider-config.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              throw "PowerShell parser rejected $path"
            }
          }

      - name: Create exact offline safe deployment ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $env:TARGET_COMMIT.ToLowerInvariant()
          $short = $target.Substring(0, 12)
          $artifactRoot = Join-Path $PWD 'artifact'
          $packageRoot = Join-Path $artifactRoot "loldata-video-free-offline-safe-deploy-$short"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          git branch -f lapi-video-free-target $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create exact bundle ref' }
          $bundle = Join-Path $packageRoot 'lapi-video-free-offline.bundle'
          git bundle create $bundle refs/heads/lapi-video-free-target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create bundle' }
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Bundle verify failed' }
          $heads = (git bundle list-heads $bundle).Trim()
          $expectedHeads = "$target refs/heads/lapi-video-free-target"
          if ($heads -ne $expectedHeads) { throw "Bundle heads mismatch: $heads" }

          Copy-Item 'ops/Deploy-LapiVideoFreeOffline.ps1' (Join-Path $packageRoot 'deploy-video-free-api.ps1') -Force
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 'lapi-video-free-offline-deploy.v1'
            target_commit = $target
            source_pr = 19
            bundle_ref = 'refs/heads/lapi-video-free-target'
            bundle_sha256 = $bundleHash
            tests = 'pass'
            video_feature = 'retired'
            old_groupguard_dist = 'revoked_do_not_deploy'
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $packageRoot 'PACKAGE-MANIFEST.json'),
            (($manifest | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false))
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $packageRoot 'TARGET_COMMIT.txt'),
            ($target + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false))
          )
          $cmd = @"
          @echo off
          chcp 65001 >nul
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0deploy-video-free-api.ps1" -ExpectedCommit $target
          echo.
          if errorlevel 1 (
            echo DEPLOYMENT FAILED OR ROLLED BACK. Keep the window output.
          ) else (
            echo DEPLOYMENT SUCCEEDED.
          )
          pause
          "@.Trim()
          [System.IO.File]::WriteAllText(
            (Join-Path $packageRoot 'run-deploy.cmd'),
            ($cmd + [Environment]::NewLine),
            [System.Text.Encoding]::ASCII
          )
          $readme = @"
          LOLDataSystem video-free offline safe deployment

          Target commit: $target

          Usage:
          1. Extract this ZIP completely.
          2. Double-click run-deploy.cmd.
          3. Approve the Administrator prompt.
          4. Keep the final console output for acceptance.

          Safety:
          - Imports only the fixed Git bundle in this package.
          - Runs full candidate tests before stopping production.
          - Backs up code-adjacent runtime state and ACL-protects the backup.
          - Removes only QUERY_VIDEO_PROVIDERS_JSON after deployment.
          - Preserves risk Provider and custom dynamic Provider settings.
          - Validates that video is rejected after deployment.
          - Rolls back the full deployment if post-deployment retirement validation fails.

          Never deploy the revoked GroupGuard dist commit 029118346adaa9232aeceeb283f5d243a407dc95.
          "@.Trim()
          [System.IO.File]::WriteAllText(
            (Join-Path $packageRoot 'README.txt'),
            ($readme + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false))
          )

          $zip = Join-Path $artifactRoot "loldata-video-free-offline-safe-deploy-$short.zip"
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $artifactRoot 'SHA256SUMS.txt'),
            ("$zipHash  $([System.IO.Path]::GetFileName($zip))" + [Environment]::NewLine),
            [System.Text.Encoding]::ASCII
          )
          Write-Host "ZIP=$zip"
          Write-Host "ZIP_SHA256=$zipHash"
          Write-Host "BUNDLE_SHA256=$bundleHash"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: loldata-video-free-offline-safe-deploy-${{ env.TARGET_COMMIT }}
          path: |
            artifact/*.zip
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary packaging workflow
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/package-video-free-offline-deploy-20260730.yml' -Force
          git config user.name 'openai-gpt-5.6-thinking'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): remove one-shot video-free packager'
          git push origin HEAD:feat/all-query-delivery-hub-20260729
